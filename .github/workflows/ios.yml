name: iOS build
on:
  push:
    branches: [main]
  workflow_dispatch: {}
jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore FFmpeg (ios)
        uses: actions/cache@v4
        with:
          path: ffmpeg/ios
          key: ffmpeg-ios-n7.1.1-${{ hashFiles('ci/build-ffmpeg.sh') }}
      - name: Build FFmpeg (ios)
        run: ci/build-ffmpeg.sh ios
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild -project Kadr.xcodeproj -scheme Kadr -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Kadr.app Payload/
          zip -qry Kadr-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Kadr-unsigned-ipa
          path: Kadr-unsigned.ipa
      - name: Publish install file to the dist branch
        run: |
          mkdir dist && cp Kadr-unsigned.ipa dist/Kadr.ipa && cd dist
          git init -q -b dist
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Kadr.ipa && git commit -qm "Kadr build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" dist

  simulator-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Restore FFmpeg (sim)
        uses: actions/cache@v4
        with:
          path: ffmpeg/sim
          key: ffmpeg-sim-n7.1.1-${{ hashFiles('ci/build-ffmpeg.sh') }}
      - name: Build FFmpeg (sim)
        run: ci/build-ffmpeg.sh sim
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build for simulator
        run: |
          xcodebuild -project Kadr.xcodeproj -scheme Kadr -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath simbuild CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= build | tail -5
      - name: Run self-test in simulator
        run: |
          set -x
          DEV=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          ios=sorted([k for k in d if 'iOS' in k], key=lambda k:[int(x) for x in k.split('iOS-')[1].split('-')])
          for k in reversed(ios):
              ph=[x for x in d[k] if x['name'].startswith('iPhone')]
              if ph: print(ph[0]['udid']); break
          ")
          echo "device $DEV"
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" simbuild/Build/Products/Debug-iphonesimulator/Kadr.app
          DATA=$(xcrun simctl get_app_container "$DEV" com.eliorsasi.kadr data)
          mkdir -p "$DATA/Documents" && cp ci/test.mp4 ci/test.mkv ci/test.avi ci/test10.mkv "$DATA/Documents/"
          : > sim.log
          ok=0
          for f in test.mp4 test.mkv test.avi test10.mkv; do
            echo "===== $f" >> sim.log
            xcrun simctl launch --console-pty --terminate-running-process "$DEV" com.eliorsasi.kadr -KadrTestVideo "$f" >> sim.log 2>&1 &
            for i in $(seq 1 60); do sleep 2; grep -q "SELFTEST DONE" <(sed -n "/===== $f/,\$p" sim.log) && break; done
            xcrun simctl io "$DEV" screenshot "sim-${f%.*}-${f##*.}.png"
            xcrun simctl terminate "$DEV" com.eliorsasi.kadr || true
            sleep 2
            if sed -n "/===== $f/,\$p" sim.log | grep -q "SELFTEST DONE"; then ok=$((ok+1)); fi
          done
          cat sim.log
          echo "passed $ok of 4"
          [ "$ok" = 4 ]
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-result
          path: |
            sim.log
            sim-*.png
